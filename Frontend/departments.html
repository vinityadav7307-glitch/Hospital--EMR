<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments — Meridian Health</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="mark">M</span><span class="name">Meridian</span></div>
    <div class="sidebar-role">Admin Panel</div>
    <nav class="sidebar-nav">
      <a href="admin-dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="doctors.html"><i class="bi bi-person-badge"></i> Doctors</a>
      <a href="patients.html"><i class="bi bi-people"></i> Patients</a>
      <a href="departments.html"><i class="bi bi-diagram-3"></i> Departments</a>
      <a href="appointments.html"><i class="bi bi-calendar2-week"></i> Appointments</a>
      <a href="visits.html"><i class="bi bi-clipboard2-pulse"></i> Visits</a>
      <a href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a>
      <a href="billing.html"><i class="bi bi-receipt"></i> Billing</a>
      <a href="audit-logs.html"><i class="bi bi-journal-text"></i> Audit Logs</a>
      <a href="settings.html"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-foot"><a href="index.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle" data-sidebar-toggle><i class="bi bi-list"></i></button>
        <span class="page-title">Departments</span>
      </div>
      <div class="user-chip"><span class="text-muted-soft small d-none d-sm-inline">Admin User</span><div class="avatar">AU</div></div>
    </header>

    <main class="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted-soft mb-0">Manage hospital departments and see staffing at a glance.</p>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#deptModal"><i class="bi bi-plus-lg me-1"></i>Add Department</button>
      </div>
      <div class="row g-3" id="deptCards"></div>
    </main>
  </div>
</div>

<div class="modal fade" id="deptModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="deptForm">
        <div class="modal-header"><h5 class="modal-title font-display">Add Department</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3 was-validated-field">
            <label class="form-label">Department Name</label>
            <input type="text" class="form-control" id="deptName" required placeholder="e.g. Oncology">
            <div class="invalid-msg">Name is required.</div>
          </div>
          <div class="was-validated-field">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" id="deptDesc" required placeholder="Short description">
            <div class="invalid-msg">Description is required.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Department</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="deptDetailModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title font-display" id="deptDetailTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="deptDetailBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mockData.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  let departments = [...MOCK.departments];
  const icons = ["bi-heart-pulse","bi-bandaid","bi-emoji-smile","bi-droplet","bi-activity","bi-clipboard2-pulse"];

  function renderDepts() {
    document.getElementById("deptCards").innerHTML = departments.map((d,i) => `
      <div class="col-md-6 col-xl-4">
        <div class="panel p-3 h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div class="icon-tile mb-2" style="background:var(--info-bg);color:var(--clinical-blue);"><i class="bi ${icons[i%icons.length]}"></i></div>
            <div class="dropdown">
              <button class="btn btn-sm btn-ghost" data-bs-toggle="dropdown"><i class="bi bi-three-dots"></i></button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="viewDept('${d.id}');return false;">View Details</a></li>
                <li><a class="dropdown-item" href="#" onclick="editDeptPrompt('${d.id}');return false;">Edit</a></li>
              </ul>
            </div>
          </div>
          <h3 class="h6 font-display mb-1">${d.name}</h3>
          <p class="small text-muted-soft mb-2">${d.description}</p>
          <span class="badge-status badge-active">${d.doctors} doctors</span>
        </div>
      </div>`).join("");
  }
  renderDepts();

  function viewDept(id) {
    const d = departments.find(x => x.id === id);
    document.getElementById("deptDetailTitle").textContent = d.name;
    document.getElementById("deptDetailBody").innerHTML = `
      <p class="text-muted-soft">${d.description}</p>
      <div class="row g-2 small">
        <div class="col-6 text-faint">Department ID</div><div class="col-6">${d.id}</div>
        <div class="col-6 text-faint">Doctors assigned</div><div class="col-6">${d.doctors}</div>
      </div>`;
    new bootstrap.Modal(document.getElementById("deptDetailModal")).show();
  }
  function editDeptPrompt(id) {
    // Simple inline edit via prompt to keep this demo page compact.
    const d = departments.find(x => x.id === id);
    const newName = prompt("Department name", d.name);
    if (newName) { d.name = newName; renderDepts(); showToast("Department updated.", "success"); }
  }

  document.getElementById("deptForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!validateForm(e.target)) return;
    departments.unshift({
      id: "D-" + String(departments.length + 1).padStart(2,"0"),
      name: document.getElementById("deptName").value,
      description: document.getElementById("deptDesc").value,
      doctors: 0,
    });
    // TODO: Connect this function to your backend API (POST /departments)
    renderDepts();
    e.target.reset();
    bootstrap.Modal.getInstance(document.getElementById("deptModal")).hide();
    showToast("Department added.", "success");
  });
</script>
</body>
</html>
