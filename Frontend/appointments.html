<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointments — Meridian Health</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="mark">M</span><span class="name">Meridian</span></div>
    <div class="sidebar-role">Admin Panel</div>
    <nav class="sidebar-nav">
      <a href="admin-dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="doctors.html"><i class="bi bi-person-badge"></i> Doctors</a>
      <a href="patients.html"><i class="bi bi-people"></i> Patients</a>
      <a href="departments.html"><i class="bi bi-diagram-3"></i> Departments</a>
      <a href="appointments.html"><i class="bi bi-calendar2-week"></i> Appointments</a>
      <a href="visits.html"><i class="bi bi-clipboard2-pulse"></i> Visits</a>
      <a href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a>
      <a href="billing.html"><i class="bi bi-receipt"></i> Billing</a>
      <a href="audit-logs.html"><i class="bi bi-journal-text"></i> Audit Logs</a>
      <a href="settings.html"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-foot"><a href="index.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle" data-sidebar-toggle><i class="bi bi-list"></i></button>
        <span class="page-title">Appointments</span>
      </div>
      <div class="user-chip"><span class="text-muted-soft small d-none d-sm-inline">Admin User</span><div class="avatar">AU</div></div>
    </header>

    <main class="content">
      <div class="panel">
        <div class="panel-head flex-wrap gap-2">
          <h2>All Appointments</h2>
          <div class="d-flex gap-2 flex-wrap">
            <select class="form-select form-select-sm" id="statusFilter" style="width:auto;">
              <option value="">All Statuses</option>
              <option>Scheduled</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option><option>No-show</option>
            </select>
            <div class="input-group input-group-sm" style="width:220px;">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control" id="apptSearch" placeholder="Search patient or doctor...">
            </div>
            <a href="book-appointment.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>New Appointment</a>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table-clean mb-0">
            <thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr></thead>
            <tbody id="apptBody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="apptEmpty" style="display:none;"><i class="bi bi-calendar-x"></i>No appointments match your filters.</div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="apptDetailModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title font-display">Appointment Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="apptDetailBody"></div>
      <div class="modal-footer" id="apptDetailFooter"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mockData.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  let appointments = [...MOCK.appointments];

  function renderAppts() {
    const q = document.getElementById("apptSearch").value.toLowerCase();
    const status = document.getElementById("statusFilter").value;
    const filtered = appointments.filter(a =>
      (!status || a.status === status) &&
      (a.patient.toLowerCase().includes(q) || a.doctor.toLowerCase().includes(q))
    );
    document.getElementById("apptEmpty").style.display = filtered.length ? "none" : "block";
    document.getElementById("apptBody").innerHTML = filtered.map(a => `
      <tr>
        <td class="text-faint">${a.id}</td>
        <td class="fw-semibold">${a.patient}</td>
        <td>${a.doctor}</td>
        <td>${a.date}</td>
        <td>${a.time}</td>
        <td><span class="badge-status ${statusBadgeClass(a.status)}">${a.status}</span></td>
        <td class="text-end"><button class="btn btn-sm btn-ghost border" onclick="viewAppt('${a.id}')"><i class="bi bi-eye"></i> Details</button></td>
      </tr>`).join("");
  }
  renderAppts();
  document.getElementById("apptSearch").addEventListener("input", renderAppts);
  document.getElementById("statusFilter").addEventListener("change", renderAppts);

  function viewAppt(id) {
    const a = appointments.find(x => x.id === id);
    document.getElementById("apptDetailBody").innerHTML = `
      <div class="row g-2 small mb-2">
        <div class="col-5 text-faint">Appointment ID</div><div class="col-7">${a.id}</div>
        <div class="col-5 text-faint">Patient</div><div class="col-7">${a.patient}</div>
        <div class="col-5 text-faint">Doctor</div><div class="col-7">${a.doctor}</div>
        <div class="col-5 text-faint">Department</div><div class="col-7">${a.department}</div>
        <div class="col-5 text-faint">Date &amp; Time</div><div class="col-7">${a.date} · ${a.time}</div>
        <div class="col-5 text-faint">Reason</div><div class="col-7">${a.reason}</div>
        <div class="col-5 text-faint">Status</div><div class="col-7"><span class="badge-status ${statusBadgeClass(a.status)}">${a.status}</span></div>
      </div>`;
    const footer = document.getElementById("apptDetailFooter");
    footer.innerHTML = (a.status === "Cancelled" || a.status === "Completed")
      ? `<button class="btn btn-ghost border" data-bs-dismiss="modal">Close</button>`
      : `<button class="btn btn-ghost border" data-bs-dismiss="modal">Close</button>
         <button class="btn" style="background:var(--danger);color:#fff;" onclick="cancelAppt('${a.id}')">Cancel Appointment</button>`;
    new bootstrap.Modal(document.getElementById("apptDetailModal")).show();
  }

  async function cancelAppt(id) {
    // TODO: Connect this function to your backend API (AppointmentService.cancel)
    await AppointmentService.cancel(id);
    appointments = appointments.map(a => a.id === id ? { ...a, status: "Cancelled" } : a);
    renderAppts();
    bootstrap.Modal.getInstance(document.getElementById("apptDetailModal")).hide();
    showToast("Appointment cancelled.", "danger");
  }
</script>
</body>
</html>
