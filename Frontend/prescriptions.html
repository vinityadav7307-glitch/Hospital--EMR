<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescriptions — Meridian Health</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="mark">M</span><span class="name">Meridian</span></div>
    <div class="sidebar-role">Doctor Panel</div>
    <nav class="sidebar-nav">
      <a href="doctor-dashboard.html"><i class="bi bi-grid-1x2"></i> My Appointments</a>
      <a href="visits.html"><i class="bi bi-clipboard2-pulse"></i> Visits</a>
      <a href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a>
      <a href="settings.html"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-foot"><a href="index.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle" data-sidebar-toggle><i class="bi bi-list"></i></button>
        <span class="page-title">Prescriptions</span>
      </div>
      <div class="user-chip"><span class="text-muted-soft small d-none d-sm-inline">Dr. Ananya Rao</span><div class="avatar">AR</div></div>
    </header>

    <main class="content">
      <div class="panel">
        <div class="panel-head">
          <h2>All Prescriptions</h2>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#rxModal"><i class="bi bi-plus-lg me-1"></i>Add Prescription</button>
        </div>
        <div class="table-responsive">
          <table class="table-clean mb-0">
            <thead><tr><th>RX ID</th><th>Patient</th><th>Medicine</th><th>Dosage</th><th>Frequency</th><th>Duration</th><th>Date</th></tr></thead>
            <tbody id="rxBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="rxModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="rxForm">
        <div class="modal-header"><h5 class="modal-title font-display">Add Prescription</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3 was-validated-field">
            <label class="form-label">Patient</label>
            <select class="form-select" id="rxPatient" required></select>
            <div class="invalid-msg">Select a patient.</div>
          </div>
          <div class="mb-3 was-validated-field">
            <label class="form-label">Medicine Name</label>
            <input type="text" class="form-control" id="rxMedicine" required placeholder="e.g. Amoxicillin">
            <div class="invalid-msg">Required.</div>
          </div>
          <div class="row g-3">
            <div class="col-4 was-validated-field">
              <label class="form-label">Dosage</label>
              <input type="text" class="form-control" id="rxDosage" required placeholder="500mg">
              <div class="invalid-msg">Required.</div>
            </div>
            <div class="col-4 was-validated-field">
              <label class="form-label">Frequency</label>
              <input type="text" class="form-control" id="rxFrequency" required placeholder="2x daily">
              <div class="invalid-msg">Required.</div>
            </div>
            <div class="col-4 was-validated-field">
              <label class="form-label">Duration</label>
              <input type="text" class="form-control" id="rxDuration" required placeholder="7 days">
              <div class="invalid-msg">Required.</div>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label">Instructions</label>
            <input type="text" class="form-control" id="rxInstructions" placeholder="e.g. Take after food">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Prescription</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mockData.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  let rxList = [...MOCK.prescriptions];
  const rxPatientSel = document.getElementById("rxPatient");
  MOCK.patients.forEach(p => rxPatientSel.innerHTML += `<option value="${p.name}">${p.name}</option>`);

  function renderRx() {
    document.getElementById("rxBody").innerHTML = rxList.map(r => `
      <tr>
        <td class="text-faint">${r.id}</td>
        <td class="fw-semibold">${r.patient}</td>
        <td>${r.medicine}</td>
        <td>${r.dosage}</td>
        <td>${r.frequency}</td>
        <td>${r.duration}</td>
        <td>${r.date}</td>
      </tr>`).join("");
  }
  renderRx();

  document.getElementById("rxForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!validateForm(e.target)) return;
    const payload = {
      id: "RX-" + Math.floor(5000 + Math.random()*900),
      visitId: null,
      patient: document.getElementById("rxPatient").value,
      medicine: document.getElementById("rxMedicine").value,
      dosage: document.getElementById("rxDosage").value,
      frequency: document.getElementById("rxFrequency").value,
      duration: document.getElementById("rxDuration").value,
      instructions: document.getElementById("rxInstructions").value,
      date: new Date().toISOString().split("T")[0],
    };
    // TODO: Connect this function to your backend API (PrescriptionService.create)
    await PrescriptionService.create(payload);
    rxList.unshift(payload);
    renderRx();
    e.target.reset();
    bootstrap.Modal.getInstance(document.getElementById("rxModal")).hide();
    showToast("Prescription added.", "success");
  });
</script>
</body>
</html>
