<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Meridian Health</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="mark">M</span><span class="name">Meridian</span></div>
    <div class="sidebar-role">Settings</div>
    <nav class="sidebar-nav">
      <a href="admin-dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="settings.html" class="active"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-foot"><a href="index.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle" data-sidebar-toggle><i class="bi bi-list"></i></button>
        <span class="page-title">Settings</span>
      </div>
      <div class="user-chip"><span class="text-muted-soft small d-none d-sm-inline">User</span><div class="avatar">U</div></div>
    </header>

    <main class="content">
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="panel">
            <div class="panel-head"><h2>Profile</h2></div>
            <div class="panel-body">
              <form id="profileForm">
                <div class="mb-3">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-control" value="Admin User">
                </div>
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" value="admin@meridian.health">
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="panel">
            <div class="panel-head"><h2>Change Password</h2></div>
            <div class="panel-body">
              <form id="pwForm">
                <div class="mb-3">
                  <label class="form-label">Current Password</label>
                  <input type="password" class="form-control">
                </div>
                <div class="mb-3">
                  <label class="form-label">New Password</label>
                  <input type="password" class="form-control" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Update Password</button>
              </form>
              <p class="hint mt-3 mb-0">TODO: Connect to your backend's secure password-change endpoint. Never handle real password hashing on the frontend.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById("profileForm").addEventListener("submit", (e) => { e.preventDefault(); showToast("Profile updated.", "success"); });
  document.getElementById("pwForm").addEventListener("submit", (e) => { e.preventDefault(); showToast("Password updated.", "success"); });
</script>
</body>
</html>
