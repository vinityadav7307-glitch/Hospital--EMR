<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visits — Meridian Health</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="mark">M</span><span class="name">Meridian</span></div>
    <div class="sidebar-role">Doctor Panel</div>
    <nav class="sidebar-nav">
      <a href="doctor-dashboard.html"><i class="bi bi-grid-1x2"></i> My Appointments</a>
      <a href="visits.html"><i class="bi bi-clipboard2-pulse"></i> Visits</a>
      <a href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a>
      <a href="settings.html"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-foot"><a href="index.html"><i class="bi bi-box-arrow-left"></i> Logout</a></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle" data-sidebar-toggle><i class="bi bi-list"></i></button>
        <span class="page-title">Visit Records</span>
      </div>
      <div class="user-chip"><span class="text-muted-soft small d-none d-sm-inline">Dr. Ananya Rao</span><div class="avatar">AR</div></div>
    </header>

    <main class="content">
      <div class="panel">
        <div class="panel-head">
          <h2>Visit History</h2>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#visitModal" onclick="openAddVisit()"><i class="bi bi-plus-lg me-1"></i>Add Visit</button>
        </div>
        <div class="table-responsive">
          <table class="table-clean mb-0">
            <thead><tr><th>Visit ID</th><th>Patient</th><th>Date</th><th>Diagnosis</th><th>Follow-up</th><th></th></tr></thead>
            <tbody id="visitsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Visit Modal (includes diagnosis fields) -->
<div class="modal fade" id="visitModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="visitForm">
        <div class="modal-header">
          <h5 class="modal-title font-display" id="visitModalTitle">Add Visit</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="visitId">
          <div class="row g-3">
            <div class="col-6 was-validated-field">
              <label class="form-label">Patient</label>
              <select class="form-select" id="visitPatient" required></select>
              <div class="invalid-msg">Select a patient.</div>
            </div>
            <div class="col-6 was-validated-field">
              <label class="form-label">Visit Date</label>
              <input type="date" class="form-control" id="visitDate" required>
              <div class="invalid-msg">Required.</div>
            </div>
          </div>
          <div class="mt-3 was-validated-field">
            <label class="form-label">Chief Complaint</label>
            <input type="text" class="form-control" id="visitComplaint" required placeholder="What the patient reported">
            <div class="invalid-msg">Required.</div>
          </div>
          <div class="mt-3 was-validated-field">
            <label class="form-label">Diagnosis</label>
            <input type="text" class="form-control" id="visitDiagnosis" required placeholder="e.g. Early-stage osteoarthritis">
            <div class="invalid-msg">Diagnosis is required.</div>
          </div>
          <div class="mt-3">
            <label class="form-label">Clinical / Treatment Notes</label>
            <textarea class="form-control" id="visitNotes" rows="3" placeholder="Treatment plan, advice given, medication direction"></textarea>
          </div>
          <div class="mt-3">
            <label class="form-label">Follow-up Date <span class="text-faint fw-normal">(optional)</span></label>
            <input type="date" class="form-control" id="visitFollowUp">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Visit</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="viewVisitModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title font-display">Visit Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="viewVisitBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mockData.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  let visits = [...MOCK.visits];
  const visitPatientSel = document.getElementById("visitPatient");
  MOCK.patients.forEach(p => visitPatientSel.innerHTML += `<option value="${p.name}">${p.name}</option>`);

  function renderVisits() {
    document.getElementById("visitsBody").innerHTML = visits.map(v => `
      <tr>
        <td class="text-faint">${v.id}</td>
        <td class="fw-semibold">${v.patient}</td>
        <td>${v.date}</td>
        <td>${v.diagnosis}</td>
        <td>${v.followUp || "—"}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-ghost border" onclick="viewVisit('${v.id}')"><i class="bi bi-eye"></i></button>
          <button class="btn btn-sm btn-ghost border" onclick="editVisit('${v.id}')"><i class="bi bi-pencil"></i></button>
        </td>
      </tr>`).join("");
  }
  renderVisits();

  function openAddVisit() {
    document.getElementById("visitForm").reset();
    document.getElementById("visitId").value = "";
    document.getElementById("visitModalTitle").textContent = "Add Visit";
  }
  function editVisit(id) {
    const v = visits.find(x => x.id === id);
    document.getElementById("visitModalTitle").textContent = "Edit Visit";
    document.getElementById("visitId").value = v.id;
    document.getElementById("visitPatient").value = v.patient;
    document.getElementById("visitDate").value = v.date;
    document.getElementById("visitComplaint").value = v.chiefComplaint;
    document.getElementById("visitDiagnosis").value = v.diagnosis;
    document.getElementById("visitNotes").value = v.notes;
    document.getElementById("visitFollowUp").value = v.followUp || "";
    new bootstrap.Modal(document.getElementById("visitModal")).show();
  }
  function viewVisit(id) {
    const v = visits.find(x => x.id === id);
    document.getElementById("viewVisitBody").innerHTML = `
      <div class="row g-2 small">
        <div class="col-4 text-faint">Patient</div><div class="col-8">${v.patient}</div>
        <div class="col-4 text-faint">Visit Date</div><div class="col-8">${v.date}</div>
        <div class="col-4 text-faint">Chief Complaint</div><div class="col-8">${v.chiefComplaint}</div>
        <div class="col-4 text-faint">Diagnosis</div><div class="col-8">${v.diagnosis}</div>
        <div class="col-4 text-faint">Notes</div><div class="col-8">${v.notes || "—"}</div>
        <div class="col-4 text-faint">Follow-up</div><div class="col-8">${v.followUp || "—"}</div>
      </div>`;
    new bootstrap.Modal(document.getElementById("viewVisitModal")).show();
  }

  document.getElementById("visitForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!validateForm(e.target)) return;
    const id = document.getElementById("visitId").value;
    const payload = {
      id: id || "VIS-" + Math.floor(4000 + Math.random()*900),
      appointmentId: null,
      patient: document.getElementById("visitPatient").value,
      doctor: "Dr. Ananya Rao",
      date: document.getElementById("visitDate").value,
      chiefComplaint: document.getElementById("visitComplaint").value,
      diagnosis: document.getElementById("visitDiagnosis").value,
      notes: document.getElementById("visitNotes").value,
      followUp: document.getElementById("visitFollowUp").value,
    };
    // TODO: Connect this function to your backend API (VisitService.create)
    await VisitService.create(payload);
    if (id) visits = visits.map(v => v.id === id ? payload : v); else visits.unshift(payload);
    renderVisits();
    bootstrap.Modal.getInstance(document.getElementById("visitModal")).hide();
    showToast(id ? "Visit updated." : "Visit recorded.", "success");
  });
</script>
</body>
</html>
