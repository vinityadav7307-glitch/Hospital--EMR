server.port=${HEALPOINT_API_PORT:8080}
spring.datasource.url=jdbc:mysql://${HEALPOINT_DB_HOST:localhost}:${HEALPOINT_DB_PORT:3306}/${HEALPOINT_DB_NAME:hospital_emr}?useSSL=${HEALPOINT_DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${HEALPOINT_DB_USER:root}
spring.datasource.password=${HEALPOINT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.default-property-inclusion=non_null
